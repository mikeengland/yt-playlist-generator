[project]
name = "djset"
version = "0.1.0"
description = "Works out which Tracks a DJ plays in a YouTube Set and prints a Tracklist with links to each Timestamp"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.15",
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,openai]>=2.58",
    "shazamio>=0.8.1",
    "typer>=0.15",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
djset = "djset.cli:main"
djset-eval = "djset.evaluation:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
